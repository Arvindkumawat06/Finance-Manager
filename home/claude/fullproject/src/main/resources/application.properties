# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── MySQL Database ────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/financedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=N2E0ZjJlOGQxYzZiOWEzZjVlMGQ3YzJiOGExZjRlOWQzYzZiMGE1ZjJlOGQxYzdiNGE5ZjNlMGQ2YzJiOGExZg==
app.jwt.expiration-ms=86400000

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.financeapp=DEBUG
logging.level.org.springframework.security=INFO
